<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characters</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Personajes de 'Musashi'</h1>

    <div class="comic-link">
        <h2>Enlace al cómic:</h2>
        <a href="https://www.webtoons.com/es/canvas/musashi/list?title_no=933940" target="_blank" class="enlace">Webtoon</a>
    </div>

    <div class="characters">
        <!-- Tarjeta de Sasaki -->
        <div class="card sasaki">
            <h2>Sasaki</h2>
            <ul>
                <li>Sasaki Musashi</li>
                <li>29/02</li>
                <li>Arroz</li>
            </ul>
            <!-- src es la ruta a la imagen - class es la clase CSS -->
            <img src="imagenes/sasaki.png" class="img-sasaki">
        </div>

        <!-- Tarjeta de Akira -->
        <div class="card akira">
            <h2>Akira</h2>
            <ul>
                <li>Akira Takamori</li>
                <li>10/03</li>
                <li>Fideos</li>
            </ul>
            <img src="imagenes/akira.png" class="img-akira">
        </div>

        <!-- Tarjeta de Ayame -->
        <div class="card ayame">
            <h2>Ayame</h2>
            <ul>
                <li>Ayame Kimura</li>
                <li>04/11</li>
                <li>Sushi</li>
            </ul>
            <img src="imagenes/ayame.png" class="img-ayame">
        </div>
    </div>

</body>
</html>
